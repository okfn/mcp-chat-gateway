<div class="okfn-institutional-menu">
  <div id="ok-panel" class="closed">
    <div class="container">
      <iframe
        src="https://a.okfn.org/html/oki/panel/panel.html"
        title="Open Knowledge Foundation navigation"
        scrolling="no"></iframe>
    </div>
  </div>
  <div id="ok-panel-wrapper">
    <a class="white ok-ribbon closed" role="button" tabindex="0" aria-label="Open Open Knowledge Foundation navigation" aria-expanded="false">
      <img src="https://a.okfn.org/html/oki/panel/assets/images/oki-ribbon.png" alt="Open Knowledge Foundation">
    </a>
  </div>
</div>

<header>
  <nav class="nav">
    <div class="nav-leading">
      <div class="nav-title">
        <a class="brand-mark" href="https://okfn.org" target="_blank" rel="noopener noreferrer" aria-label="Open Knowledge Foundation">
          <img src="static/lg-okfn.svg" alt="Open Knowledge Foundation">
        </a>
        <a href="/" class="nav-link" data-i18n="nav.brand">Open Data Chat</a>
        <span class="alpha-badge" data-i18n="nav.alphaBadge">Alpha</span>
      </div>
    </div>
    <div class="nav-links">
      <a href="/about" class="nav-link" data-i18n="nav.about">About</a>
      <a href="/how-to" class="nav-link" data-i18n="nav.howTo">How it works</a>
      <a href="/how-to#technical-details" class="nav-link" data-i18n="nav.technicalInfo">Technical info</a>
      <a href="/how-to#available-tools" class="nav-link" data-i18n="nav.tools">Tools</a>
      <a href="/about#resources" class="nav-link" data-i18n="nav.resources">Resources</a>
      <div class="lang-switcher" role="group" aria-label="Language">
        <button type="button" class="lang-btn" data-lang-switch="en" aria-pressed="false">EN</button>
        <button type="button" class="lang-btn" data-lang-switch="es" aria-pressed="false">ES</button>
        <button type="button" class="lang-btn" data-lang-switch="pt" aria-pressed="false">PT</button>
      </div>
    </div>
  </nav>
</header>
<script defer src="https://a.okfn.org/html/oki/panel/assets/js/frontend.js"></script>
<script>
  (() => {
    const ribbon = document.querySelector("#ok-panel-wrapper .ok-ribbon");
    if (!ribbon) return;

    ribbon.addEventListener("click", () => {
      const willOpen = ribbon.classList.contains("closed");
      ribbon.setAttribute("aria-expanded", String(willOpen));
      ribbon.setAttribute(
        "aria-label",
        `${willOpen ? "Close" : "Open"} Open Knowledge Foundation navigation`
      );
    });
    ribbon.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        ribbon.click();
      }
    });
  })();
</script>
