<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header>Chat</header>

<div id="main">
  <div id="viz-panel">
    <div id="viz-placeholder">Charts and tables will appear here</div>
    <div id="viz-content"></div>
  </div>

  <div id="chat-panel">
    <div id="messages"></div>
    <div id="input-area">
      <textarea id="input" rows="1" placeholder="Type a message..." autofocus></textarea>
      <button id="send">Send</button>
    </div>
  </div>
</div>

<script src="/static/chart.js"></script>
<script src="/static/chat.js"></script>

</body>
</html>
