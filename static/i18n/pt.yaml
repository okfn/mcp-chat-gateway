# Portuguese (pt) translations for the Open Data Chat gateway.
# See en.yaml for the canonical source — keep keys in sync with that file.


# Barra de navegação superior, presente em todas as páginas.
nav:
  # Nome do produto (canto superior esquerdo). É marca — normalmente não se traduz.
  brand: Chat de Dados Abertos
  # Botão que abre a gaveta lateral de ferramentas.
  tools: Ferramentas
  # Botão que abre a gaveta lateral de documentos de referência.
  resources: Documentos
  howTo: Como usar
  about: Sobre


# Banner que avisa que o projeto está em alfa. Inclui link para /how-to.
alert:
  alpha: 'Este projeto ainda está em alfa. Consulte a seção <a href="/how-to">Como usar</a> para um guia.'


# Gaveta lateral direita com as ferramentas MCP agrupadas por plugin.
drawer:
  title: Ferramentas disponíveis
  # Mostrado enquanto /tools está sendo carregado.
  loading: Carregando ferramentas…


# Gaveta lateral direita com os recursos MCP (PDFs, documentos, CSVs)
# agrupados por plugin. A IA NÃO os lê automaticamente — esta é uma
# superfície humana de navegação/download e um alvo de citação.
resourcesDrawer:
  title: Documentos de referência
  loading: Carregando documentos…
  empty: Ainda não há documentos de referência.
  download: Baixar
  open: Abrir
  source: Fonte original


# Tela inicial (antes da primeira pergunta).
landing:
  # Título principal. Curto, acionável.
  title: Pergunte aos dados abertos
  # Subtítulo. Duas frases no máximo; explica a proposta de valor.
  tagline: 'Respostas reais sobre dados públicos reais. Cada resposta é fundamentada em uma chamada de ferramenta — nunca inventada pelo modelo.'
  # Placeholder dentro do campo de busca vazio.
  placeholder: Faça uma pergunta sobre dados abertos...
  # Texto do botão de envio.
  ask: Perguntar

  # Mini-links abaixo da barra de busca.
  meta:
    prompt: É sua primeira vez?
    howTo: Como funciona
    tools: Ver todas as ferramentas
    about: Sobre este piloto

  # Cartões de plugins (um por fonte de dados conectada).
  plugins:
    loading: Carregando fontes de dados…
    error: 'Não foi possível carregar as fontes de dados. O servidor MCP está rodando?'
    empty: Ainda não há fontes de dados disponíveis.
    # Rótulo acima dos chips de perguntas-exemplo de cada cartão.
    sampleLabel: Experimente uma destas
    # Quantidade de ferramentas no cartão. {n} é o número.
    toolsCount: '{n} ferramentas'
    # Forma singular quando há exatamente uma.
    toolsCountOne: 1 ferramenta

  # Rodapé inferior. O link abre a gaveta de ferramentas.
  footer:
    tech: 'Desenvolvido com o servidor MCP da OKFN. As ferramentas e datasets vêm de plugins independentes (veja as <a href="#" id="landing-footer-tools">fontes de dados</a> abaixo).'


# Visão de chat — depois que o usuário envia a primeira mensagem.
chat:
  placeholder: Digite uma mensagem...
  send: Enviar
  # Rótulo exibido antes de cada link de fonte na resposta do bot.
  sourceLabel: 'Fonte:'
  # Dica no cabeçalho de uma tabela/gráfico recolhido para deixar claro que pode
  # ser aberto.
  expandHint: toque para ver
  # Rótulo de cabeçalho de uma mensagem de ferramenta injetada (forçada).
  force:
    label: Mensagem
  # Controles da mensagem de tabela: link de download CSV e o recolhimento de linhas.
  table:
    # Rótulo do cabeçalho recolhido, ex. "Tabela (42 linhas): nome, populacao, ...".
    label: Tabela
    rows: linhas
    download: Baixar CSV
    downloadExcel: Baixar CSV para Excel/Windows
    showAll: Mostrar tudo
    showLess: Mostrar menos
  # Controles da mensagem de gráfico: botões de exportação no cabeçalho.
  # Mantenha-os curtos: compartilham uma única linha.
  chart:
    # Rótulo do cabeçalho recolhido, ex. "Gráfico: Populacao por departamento".
    label: Gráfico
    png: Baixar PNG
    copy: Copiar imagem
    copied: Copiado!
    copyFailed: Falha ao copiar
    html: HTML interativo
    csv: Dados (CSV)
    csvExcel: Dados (CSV Excel)
    spec: Especificação (JSON)
    failed: Falhou
  # Rodapé da mensagem do assistente: link que salva a resposta como arquivo
  # Markdown (.md).
  answer:
    download: Baixar esta resposta (markdown)
    # Botão que copia o markdown bruto da resposta para a área de transferência.
    copy: Copiar resposta
    copied: Copiado!
    copyFailed: Falha ao copiar
    # Nome de arquivo de reserva quando a primeira linha não gera um slug útil.
    filename: resposta


# Conteúdo de about.html.
about:
  hero:
    title: Respostas de IA rastreáveis para dados públicos
    p1: 'À medida que a inteligência artificial se torna cada vez mais a interface principal para acessar informações, <strong>garantir que as respostas geradas por IA sejam precisas, transparentes e fundamentadas em fontes confiáveis é cada vez mais importante</strong>. As instituições públicas que publicam dados abertos enfrentam um novo desafio: como garantir que as ferramentas de IA que referenciam seus conjuntos de dados forneçam respostas verificáveis e confiáveis.'
    p2: 'Estamos construindo uma ponte técnica (usando o Protocolo de Contexto de Modelos) que conecta a IA diretamente a portais de dados oficiais como o CKAN, <strong>para que as respostas geradas por IA possam ser rastreadas até suas fontes originais</strong>. Isso reforça a confiança nas instituições públicas, ajuda a combater a desinformação, torna os dados abertos mais acessíveis aos cidadãos e garante que pesquisas ou jornalismo baseados nesses dados estejam fundamentados em fatos.'
  partners:
    title: Parceiros
    p: 'Este projeto é uma iniciativa colaborativa baseada em desafios do mundo real. Dois programas piloto estão ocorrendo em 2026 sob o guarda-chuva da <a href="https://www.digitalpublicgoods.net/">Aliança de Bens Públicos Digitais (DPGA)</a> em parceria com governos nacionais para se tornar uma referência reproduzível e escalável de integração responsável e transparente de IA com infraestrutura de dados abertos.'
  moreInfo:
    title: 'Mais informações...'
    p: 'Para mais informações, visite a <a href="#">página oficial (em construção)</a> da iniciativa.'


# Conteúdo de how_to.html.
howTo:
  intro:
    title: Sobre esta interface de chat
    h2Works: Como funciona
    pWorks: 'Este é um chat que responde perguntas <strong>exclusivamente</strong> usando as ferramentas MCP disponíveis.'
    h2Use: Como usar
    pUse: Digite sua pergunta no campo de texto. A IA determinará automaticamente quais ferramentas chamar com base na sua pergunta e fornecerá respostas baseadas exclusivamente nos resultados das ferramentas.
    h2Expect: O que esperar
    li1: 'A IA <strong>deve chamar pelo menos uma ferramenta</strong> para cada pergunta que você fizer'
    li2: "A IA <strong>nunca responde a partir do seu próprio \"conhecimento\"</strong> — apenas usa os resultados das ferramentas"
    li3: 'Se nenhuma ferramenta puder responder à sua pergunta, você verá esta resposta: <em>"Não temos nenhuma ferramenta interna para responder à sua pergunta."</em>'
    h2Structured: Conteúdo estruturado
    pStructured: 'A interface de chat tem 5 tipos de saídas:'
    outputAssistant: '<strong>Assistente</strong>: O que a IA decidiu responder com todas as informações.'
    outputTable: '<strong>Tabela</strong>: Dados brutos da fonte (retornados pelo MCP).'
    outputChart: '<strong>Gráfico</strong>: Uma visualização interativa (retornada pelo MCP).'
    outputForce: '<strong>Mensagem</strong>: Uma mensagem escrita pelo desenvolvedor da ferramenta que não é processada pelo LLM.'
    outputSource: '<strong>Fonte</strong>: Um link para a fonte dos dados usados para fornecer a resposta.'
  tools:
    title: Ferramentas MCP disponíveis
    p1: A lista de ferramentas a seguir é a informação disponível no MCP.
    p2: Você pode usar esta lista como guia para entender que tipo de perguntas fazer e as capacidades do chat.
    noTools: Nenhuma ferramenta disponível no momento. Verifique se o servidor MCP está em execução.
  technical:
    title: Detalhes técnicos
    p: 'Para mais informações sobre implementações técnicas, você pode visitar os seguintes links:'
    liServer: 'Servidor MCP da OKFN: <a href="https://github.com/okfn/mcp-ckan">O repositório</a> do servidor MCP.'
    liChat: 'Interface de chat: <a href="https://github.com/okfn/mcp-chat-gateway">O repositório</a> desta interface.'
