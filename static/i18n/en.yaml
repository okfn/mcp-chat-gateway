# English translations for the Open Data Chat gateway.
#
# Translators: copy this file to es.yaml / pt.yaml / xx.yaml and translate the
# values on the right. Comments are notes that explain WHERE each string shows
# up in the UI — they don't appear to the user.
#
# Keys are nested for readability but flatten to dot-notation at runtime
# (e.g. `landing.plugins.empty`). Those flat names must match the data-i18n=""
# attributes in the HTML templates and the t("...") calls in chat.js.
#
# HTML is allowed in values (rendered via innerHTML). Keep the same tag
# structure as the English source so links/IDs continue to work.


# Top navigation bar shown on every page.
nav:
  # Product name shown in the top-left. Treat as a brand — usually NOT translated.
  brand: Open Data Chat
  # Small status badge displayed next to the product name.
  alphaBadge: Alpha
  # Button that opens the right-side tools drawer.
  tools: Tools
  # Button that opens the right-side resources drawer (PDFs, docs, …).
  resources: Resources
  howTo: How to
  about: About


# Right-side drawer that lists every MCP tool grouped by plugin.
drawer:
  title: Available tools
  # Shown while the /tools endpoint is being fetched.
  loading: Loading tools…


# Right-side drawer that lists every MCP resource (reference docs/PDFs/CSVs)
# grouped by plugin. Resources are NOT auto-read by the AI — this is a human
# browse/download surface and a citation target.
resourcesDrawer:
  title: Reference documents
  loading: Loading resources…
  empty: No reference documents available yet.
  # Primary download button that fetches the resource through the gateway proxy.
  download: Download
  # Primary button for link resources (text/uri-list); opens the external page.
  open: Open
  # Link that follows the publisher's original URL when a resource declares one.
  source: Original source


# Landing page — what users see before they ask their first question.
landing:
  # Big hero headline. Keep it short and action-oriented.
  title: Ask the open data
  # Subtitle under the hero. Two sentences max; explains the value prop.
  tagline: 'Real answers from real public datasets. Every reply is grounded in a tool call — never invented by the model.'
  # Placeholder shown inside the empty search input.
  placeholder: Ask a question about open data...
  # Label on the submit button next to the search input.
  ask: Ask

  # Small links/labels under the search bar.
  meta:
    prompt: New here?
    howTo: How it works
    tools: Browse all tools
    about: About this pilot

  # The plugin cards section — one card per connected MCP plugin.
  plugins:
    loading: Loading data sources…
    error: 'Could not load data sources. Is the MCP server running?'
    empty: No data sources available yet.
    # Section label above the clickable sample-question chips on each card.
    sampleLabel: Try one of these
    # Tool-count badge on each card. {n} is the number of tools.
    toolsCount: '{n} tools'
    # Singular form when there is exactly one tool.
    toolsCountOne: 1 tool

  # Bottom-of-page footer. Contains a link that opens the tools drawer.
  footer:
    tech: 'Powered by the OKFN MCP server. Tools and datasets come from independent plugins (see the <a href="#" id="landing-footer-tools">data sources</a> below).'


# Chat view — shown once the user has sent their first message.
chat:
  placeholder: Type a message...
  send: Send
  # Label shown before each citation/source link in a bot reply.
  sourceLabel: 'Source:'
  # Hint shown in the header of a collapsed table/chart message so it's clear
  # the user can open it.
  expandHint: tap to expand
  # Header label for an injected (forced) tool message.
  force:
    label: Message
  # Table message controls: CSV download link and the row-collapse toggle.
  table:
    # Collapsed-header label, e.g. "Table (42 rows): name, population, ...".
    label: Table
    rows: rows
    download: Download CSV
    downloadExcel: Download CSV for Excel/Windows
    showAll: Show all
    showLess: Show less
  # Chart message controls: export buttons in the chart header. Keep these
  # short -- they all share one line.
  chart:
    # Collapsed-header label, e.g. "Chart: Population by department".
    label: Chart
    # Download the chart as a PNG image.
    png: Download PNG
    # Copy the chart image to the clipboard (for pasting into docs/slides).
    copy: Copy image
    # Brief feedback after a successful / failed clipboard copy.
    copied: Copied!
    copyFailed: Copy failed
    # Download a self-contained interactive HTML file (works offline).
    html: Interactive HTML
    # Download the numbers behind the chart as CSV (standard / Excel flavor).
    csv: Data (CSV)
    csvExcel: Data (CSV Excel)
    # Download the raw chart spec as JSON (for power users).
    spec: Spec (JSON)
    # Brief feedback when a download action fails.
    failed: Failed
  # Assistant reply footer: link that saves the raw reply as a Markdown (.md)
  # file.
  answer:
    download: Download this answer (markdown)
    # Button that copies the reply's raw markdown to the clipboard.
    copy: Copy answer
    copied: Copied!
    copyFailed: Copy failed
    # Fallback filename stem when the reply's first line yields no usable slug.
    filename: answer
