# Spanish (es) translations for the Open Data Chat gateway.
# See en.yaml for the canonical source — keep keys in sync with that file.


# Barra de navegación superior, presente en todas las páginas.
nav:
  # Nombre del producto (arriba a la izquierda). Es marca — normalmente no se traduce.
  brand: Chat de Datos Abiertos
  # Botón que abre el panel lateral con las herramientas.
  tools: Herramientas
  # Botón que abre el panel lateral con los documentos de referencia.
  resources: Documentos
  howTo: Cómo usar
  about: Acerca de


# Banner que avisa que el proyecto está en alfa. Incluye un link a /how-to.
alert:
  alpha: 'Este proyecto está en fase alfa. Consulte la sección <a href="/how-to">Cómo usar</a> para una guía.'


# Panel lateral derecho con la lista de herramientas MCP agrupadas por plugin.
drawer:
  title: Herramientas disponibles
  # Mientras se carga el endpoint /tools.
  loading: Cargando herramientas…


# Panel lateral derecho con los recursos MCP (PDFs, documentos, CSVs) agrupados
# por plugin. La IA NO los lee automáticamente — esto es para que la persona los
# explore o descargue, y para citarlos desde las tools.
resourcesDrawer:
  title: Documentos de referencia
  loading: Cargando documentos…
  empty: Todavía no hay documentos de referencia.
  download: Descargar
  open: Abrir
  source: Fuente original


# Pantalla de inicio (antes de la primera pregunta).
landing:
  # Título principal. Cortó, accionable.
  title: Preguntale a los datos abiertos
  # Subtítulo. Dos frases como máximo; explica el valor.
  tagline: 'Respuestas reales sobre datos públicos reales. Cada respuesta está respaldada por una herramienta — nunca inventada por el modelo.'
  # Placeholder dentro del campo de búsqueda vacío.
  placeholder: Hacé una pregunta sobre datos abiertos...
  # Texto del botón de enviar.
  ask: Preguntar

  # Mini-links debajo del buscador.
  meta:
    prompt: '¿Es tu primera vez?'
    howTo: Cómo funciona
    tools: Ver todas las herramientas
    about: Sobre este piloto

  # Tarjetas de plugins (una por cada fuente de datos conectada).
  plugins:
    loading: Cargando fuentes de datos…
    error: 'No se pudieron cargar las fuentes de datos. ¿Está corriendo el servidor MCP?'
    empty: Todavía no hay fuentes de datos disponibles.
    # Etiqueta sobre los chips de preguntas-ejemplo en cada tarjeta.
    sampleLabel: Probá una de estas
    # Cantidad de herramientas en la tarjeta. {n} es el número.
    toolsCount: '{n} herramientas'
    # Forma singular cuando hay exactamente una.
    toolsCountOne: 1 herramienta

  # Pie de página inferior. El link abre el panel de herramientas.
  footer:
    tech: 'Construido con el servidor MCP de OKFN. Las herramientas y datasets provienen de plugins independientes (ver las <a href="#" id="landing-footer-tools">fuentes de datos</a> abajo).'


# Vista de chat — una vez que el usuario envió la primera pregunta.
chat:
  placeholder: Escribí un mensaje...
  send: Enviar
  # Etiqueta que aparece antes de cada enlace de fuente en la respuesta del bot.
  sourceLabel: 'Fuente:'
  # Pista en el encabezado de una tabla/gráfico plegado para dejar claro que se
  # puede abrir.
  expandHint: tocar para ver
  # Etiqueta de encabezado de un mensaje de herramienta inyectado (forzado).
  force:
    label: Mensaje
  # Controles del mensaje de tabla: enlace de descarga CSV y el plegado de filas.
  table:
    # Etiqueta del encabezado plegado, ej. "Tabla (42 filas): nombre, poblacion, ...".
    label: Tabla
    rows: filas
    download: Descargar CSV
    downloadExcel: Descargar CSV para Excel/Windows
    showAll: Ver todo
    showLess: Ver menos
  # Controles del mensaje de gráfico: botones de exportación en el encabezado.
  # Mantenerlos cortos: comparten una sola línea.
  chart:
    # Etiqueta del encabezado plegado, ej. "Gráfico: Poblacion por departamento".
    label: Gráfico
    png: Descargar PNG
    copy: Copiar imagen
    copied: ¡Copiado!
    copyFailed: Error al copiar
    html: HTML interactivo
    csv: Datos (CSV)
    csvExcel: Datos (CSV Excel)
    spec: Especificación (JSON)
    failed: Error
  # Pie del mensaje del asistente: enlace que guarda la respuesta como archivo
  # Markdown (.md).
  answer:
    download: Descargar esta respuesta (markdown)
    # Botón que copia el markdown crudo de la respuesta al portapapeles.
    copy: Copiar respuesta
    copied: ¡Copiado!
    copyFailed: Error al copiar
    # Nombre de archivo de respaldo cuando la primera línea no da un slug útil.
    filename: respuesta


# Contenido de about.html.
about:
  hero:
    title: Respuestas de IA trazables para datos públicos
    p1: 'A medida que la inteligencia artificial se convierte cada vez más en la interfaz principal para acceder a la información, <strong>garantizar que las respuestas generadas por IA sean precisas, transparentes y fundamentadas en fuentes confiables es cada vez más importante</strong>. Las instituciones públicas que publican datos abiertos enfrentan un nuevo desafío: cómo asegurar que las herramientas de IA que referencian sus conjuntos de datos proporcionen respuestas verificables y confiables.'
    p2: 'Estamos construyendo un puente técnico (usando el Protocolo de Contexto de Modelos) que conecta la IA directamente con portales de datos oficiales como CKAN, <strong>para que las respuestas generadas por IA puedan rastrearse hasta sus fuentes originales</strong>. Esto refuerza la confianza en las instituciones públicas, ayuda a combatir la desinformación, hace que los datos abiertos sean más accesibles para los ciudadanos y garantiza que las investigaciones o el periodismo basados en esos datos estén fundamentados en hechos.'
  partners:
    title: Socios
    p: 'Este proyecto es una iniciativa colaborativa basada en desafíos del mundo real. Dos programas piloto están teniendo lugar en 2026 bajo el paraguas de la <a href="https://www.digitalpublicgoods.net/">Alianza de Bienes Públicos Digitales (DPGA)</a> en asociación con gobiernos nacionales para convertirse en una referencia reproducible y escalable de integración responsable y transparente de IA con infraestructura de datos abiertos.'
  moreInfo:
    title: 'Más información...'
    p: 'Para más información visitá la <a href="#">página oficial (en construcción)</a> de la iniciativa.'


# Contenido de how_to.html.
howTo:
  intro:
    title: Acerca de esta interfaz de chat
    h2Works: Cómo funciona
    pWorks: 'Este es un chat que responde preguntas <strong>exclusivamente</strong> usando las herramientas MCP disponibles.'
    h2Use: Cómo usar
    pUse: Escribí tu pregunta en el campo de texto. La IA determinará automáticamente qué herramientas llamar según tu pregunta y proporcionará respuestas basadas únicamente en los resultados de las herramientas.
    h2Expect: Qué esperar
    li1: 'La IA <strong>debe llamar al menos una herramienta</strong> por cada pregunta que hagas'
    li2: "La IA <strong>nunca responde desde su propio \"conocimiento\"</strong> — solo usa los resultados de las herramientas"
    li3: 'Si ninguna herramienta puede responder tu pregunta, verás esta respuesta: <em>"No tenemos ninguna herramienta interna para responder tu pregunta."</em>'
    h2Structured: Contenido estructurado
    pStructured: 'La interfaz de chat tiene 5 tipos de salidas:'
    outputAssistant: '<strong>Asistente</strong>: Lo que la IA decidió responder con toda la información.'
    outputTable: '<strong>Tabla</strong>: Datos en bruto de la fuente (devueltos por el MCP).'
    outputChart: '<strong>Gráfico</strong>: Una visualización interactiva (devuelta por el MCP).'
    outputForce: '<strong>Mensaje</strong>: Un mensaje escrito por el desarrollador de la herramienta que no es procesado por el LLM.'
    outputSource: '<strong>Fuente</strong>: Un enlace a la fuente de los datos usados para dar la respuesta.'
  tools:
    title: Herramientas MCP disponibles
    p1: La siguiente lista de herramientas es la información disponible en el MCP.
    p2: Podés usar esta lista como guía para entender qué tipo de preguntas hacer y las capacidades del chat.
    noTools: No hay herramientas disponibles en este momento. Por favor, verificá que el servidor MCP esté en funcionamiento.
  technical:
    title: Detalles técnicos
    p: 'Para más información sobre implementaciones técnicas podés visitar los siguientes enlaces:'
    liServer: 'Servidor MCP de OKFN: <a href="https://github.com/okfn/mcp-ckan">El repositorio</a> del servidor MCP.'
    liChat: 'Interfaz de chat: <a href="https://github.com/okfn/mcp-chat-gateway">El repositorio</a> de esta interfaz.'
